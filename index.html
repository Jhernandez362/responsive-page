<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime World</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

    <script src="https://kit.fontawesome.com/151970cc4d.js" crossorigin="anonymous"></script>

</head>
<body>
<div class="dashboard">
    <aside class="side-bar">

        <div class="side-bar-logo">
            <h2>⛩️ OTAKU WORLD ⛩️</h2>
        </div>

        <nav>
            <ul>
                <li>
                    <a href="#anime">
                        <i class="fa-solid fa-tv"></i>
                        Anime
                    </a>
                </li>

                <li>
                    <a href="#manga">
                        <i class="fa-solid fa-book"></i>
                        Manga
                    </a>
                </li>

                <li>
                    <a href="#novelas">
                        <i class="fa-solid fa-feather"></i>
                        Novelas
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <header class="header">
        <h1>🔥 Anime Universe</h1>
        <nav class="user-nav">
            <span><i class="fa-solid fa-bell"></i></span>
            <span><i class="fa-solid fa-user"></i></span>
        </nav>
    </header>

    <main class="main-content">
        <section class="mobile-nav">
            <a href="#anime">Anime</a>
            <a href="#manga">Manga</a>
            <a href="#novelas">Novelas</a>
        </section>

        <section class="welcome-section card">
            <img src="img/anime.png" alt="Anime All">
            <div class="overlay"></div>
            <div class="card-content">        
                <h2>Bienvenid@ Otaku ⚡</h2>
                <p>Explora animes, mangas y novelas legendarias.</p>
            </div>
        </section>

        <section id="anime">
            <h2 class="section-title">🎌 Anime</h2>
            <div class="anime-grid" id="anime-grid">
                
            </div>
        </section>

        <section id="manga">
            <h2 class="section-title">📚 Manga</h2>
            <div class="manga-grid" id="manga-grid">
                
            </div>
        </section>

        <section id="novelas">
            <h2 class="section-title">📖 Novelas</h2>
            <div class="novel-grid" id="novel-grid">
                
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</div>

</body>
</html>
